<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Dashboard</title></head>
<body>
    <h1>Bienvenido, <span th:text="${user}"></span></h1>
    <p>Panel del voluntario.</p>
    <ul>
        <li><a href="/search">Buscar mascotas</a></li>
        <li><a href="/logout">Cerrar sesión</a></li>
    </ul>

    <h2>Generar reporte veterinario</h2>
    <form method="POST" action="/generate-report">
        <input type="text" name="petName" placeholder="Nombre de la mascota">
        <button type="submit">Generar</button>
    </form>
</body>
</html>
