server.port=8080
spring.thymeleaf.cache=false

# [FIX VULN-3] Ronda 2: los valores se toman de variables de entorno del
# sistema operativo. admin.username tiene un default razonable (no es
# secreto); los tres restantes NO tienen default, para que la app falle
# al arrancar si faltan (ver ShelterConfig.afterPropertiesSet()).
shelter.admin.username=${ADMIN_USERNAME:admin}
shelter.admin.password=${ADMIN_PASSWORD:}
shelter.backup.api-key=${BACKUP_SERVICE_API_KEY:}
shelter.jwt.secret=${JWT_SIGNING_SECRET:}